[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deepseek-bridge"
version = "0.1.0"
description = "Local, explicit DeepSeek delegation for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["anthropic==0.72.0", "fastmcp==2.13.0", "pydantic==2.12.3", "psutil==7.1.3"]

[project.scripts]
deepseek-bridge = "deepseek_bridge.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.3", "mypy==1.18.2", "types-psutil==7.0.0.20251001"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicit paid integration check (disabled by default)"]
