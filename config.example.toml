# Copy to ~/.config/deepseek-bridge/config.toml, outside repositories; chmod 600.
# Supply the key through the private credentials.json file, environment, or macOS Keychain.
# Never put the key in this TOML file or command arguments; see docs/operations.md.
[deepseek]
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "DEEPSEEK_API_KEY"
consultant_model = "deepseek-flash"
review_model = "deepseek-v4-pro"
research_model = "deepseek-v4-pro"
# Explicit effort is rejected until its mapping has live compatibility evidence.

[consultant]
max_files = 20
max_input_bytes = 200000
max_output_tokens = 8000
timeout_seconds = 120

[jobs]
max_concurrent = 1
max_concurrent_limit = 3
default_timeout_seconds = 1800
max_timeout_seconds = 3600

[worker]
enabled = false
compatibility_verified = false
executable = "opencode"
# Set to the exact output of your tested executable's --version, then record evidence.
# expected_version = "YOUR_VERIFIED_VERSION"
model = "deepseek/deepseek-v4-pro"
# worktree_root = "/absolute/private/path/to/worker-worktrees"
max_output_bytes = 2000000

[storage]
# Defaults to ~/.local/state/deepseek-bridge; keep outside repositories.
# state_dir = "/absolute/private/path/to/bridge-state"
database_filename = "bridge.sqlite3"
retention_days = 30

# Register only repositories you intentionally permit for outbound selection.
# [repositories.example-project]
# path = "/absolute/path/to/approved/repository"
# verification_profile = "approved-tests"
# preparation_profile = "dependencies"
# shared_resources = ["cache:project-build", "service:local-test-db"]
# [profiles.approved-tests]
# commands = [["/absolute/path/to/python", "-I", "-B", "-m", "pytest", "-q"]]
# version_commands = [["/absolute/path/to/python", "--version"]]
# environment = { LANG = "en_US.UTF-8" }
# [profiles.dependencies]
# commands = [["/absolute/path/to/uv", "sync", "--frozen"]]

# Top-level scope_registry must precede TOML tables; see docs/operations.md.
